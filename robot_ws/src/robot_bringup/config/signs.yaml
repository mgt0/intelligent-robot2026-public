# sign_node가 직접 읽는 파일 (ROS 파라미터 형식 아님). 도안 확인 후 수정.
process_width: 320
confirm_frames: 3
release_frames: 5
template_threshold: 0.5

signs:
  stop:
    hsv_ranges: [[0, 100, 70, 10, 255, 255], [170, 100, 70, 179, 255, 255]]  # 빨강은 H가 양 끝으로 나뉜다
    shape: octagon        # polygon 꼭짓점 수 7~9
    min_area_ratio: 0.004 # 영상 면적 대비. 너무 먼 것은 무시
  uturn:
    hsv_ranges: [[100, 120, 60, 130, 255, 255]]   # 파랑 [가정: 도안 확인 전]
    shape: circle         # 원형도(4πA/P²) > 0.75
    min_area_ratio: 0.004
    template: uturn.png   # 있으면 템플릿 정합 점수로 2차 확인 (robot_vision/templates/)
