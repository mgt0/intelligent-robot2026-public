line_node:
  ros__parameters:
    process_width: 320
    hsv_lower: [18, 80, 80]     # [가정] 현장 보정
    hsv_upper: [35, 255, 255]
    roi_near: [0.80, 1.00]
    roi_far: [0.60, 0.80]
    weight_near: 0.6
    weight_far: 0.4
    min_area_px: 40
    line_mode: lane3            # center, lane(2줄) 또는 lane3(3줄, 10-31 개정)
    lane3_pair: outer           # outer=L·R, left=L·C, right=C·R
    lane3_gap_px: 80            # near ROI 초기 간격. [가정] 실측 후 보정
    lane3_gap_far_px: 60        # far ROI 초기 간격(원근으로 더 좁음). 가정, 실측 보정
    lane3_forget_frames: 10     # 줄 0개가 이만큼 연속이면 직전 L·C·R 폐기
    merge_gap_px: 15
    lane_half_width_px: 100     # lane 모드용
    max_jump: 0.5
    debug: false

hand_node:
  ros__parameters:
    backend: mediapipe          # mediapipe 또는 skin
    process_width: 320
    min_detection_confidence: 0.5
    skin_ycrcb_lower: [0, 133, 77]    # [가정] 현장 보정
    skin_ycrcb_upper: [255, 173, 127]
    skin_min_area_ratio: 0.01
    skin_roi: [0.3, 1.0]
    debug: false

sign_node:
  ros__parameters:
    debug: false
